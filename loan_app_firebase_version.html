<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Circle App</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>
  <h2>Login with Phone</h2>
  <input type="text" id="phone" placeholder="+2547XXXXXXXX" />
  <button onclick="login()">Login</button>

  <h2>Request Loan</h2>
  <input type="number" id="amount" placeholder="Amount" />
  <input type="text" id="guarantors" placeholder="Guarantors (comma separated)" />
  <button onclick="requestLoan()">Request Loan</button>

  <h2>Repay Loan</h2>
  <button onclick="repayLoan()">Repay</button>

  <h2>Admin Dashboard</h2>
  <button onclick="loadLoans()">View Loans</button>
  <ul id="loanList"></ul>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  };

  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;

  function login() {
    const phone = document.getElementById("phone").value;
    alert("Simulated login for " + phone);

    currentUser = phone;

    db.collection("users").doc(phone).set({
      phone: phone,
      points: 0,
      hasActiveLoan: false
    }, { merge: true });
  }

  async function requestLoan() {
    const amount = document.getElementById("amount").value;
    const guarantors = document.getElementById("guarantors").value.split(",");

    const userRef = db.collection("users").doc(currentUser);
    const userDoc = await userRef.get();

    if (userDoc.data().hasActiveLoan) {
      alert("You already have an active loan");
      return;
    }

    await db.collection("loans").add({
      userId: currentUser,
      amount: amount,
      guarantors: guarantors,
      status: "active",
      timestamp: new Date()
    });

    await userRef.update({ hasActiveLoan: true });

    alert("Send money to 0707674585 via M-Pesa");
    alert("Thank you for your request!");
  }

  async function repayLoan() {
    const loans = await db.collection("loans")
      .where("userId", "==", currentUser)
      .where("status", "==", "active")
      .get();

    loans.forEach(async (doc) => {
      await db.collection("loans").doc(doc.id).update({ status: "repaid" });
    });

    const userRef = db.collection("users").doc(currentUser);
    await userRef.update({
      hasActiveLoan: false,
      points: firebase.firestore.FieldValue.increment(10)
    });

    alert("Loan repaid! You earned points.");
  }

  async function loadLoans() {
    const list = document.getElementById("loanList");
    list.innerHTML = "";

    const snapshot = await db.collection("loans").get();

    snapshot.forEach(doc => {
      const li = document.createElement("li");
      const data = doc.data();
      li.textContent = `${data.userId} borrowed ${data.amount} - ${data.status}`;
      list.appendChild(li);
    });
  }
</script>
</body>
</html>
